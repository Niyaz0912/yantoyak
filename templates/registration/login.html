<!-- templates/registration/login.html -->
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 400px;">
  <h2>Вход</h2>

  {% if form.errors %}
    <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="{{ form.username.id_for_label }}" class="form-label">Имя пользователя</label>
      {{ form.username }}
    </div>
    <div class="mb-3">
      <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
      {{ form.password }}
    </div>
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
</div>
{% endblock %}
